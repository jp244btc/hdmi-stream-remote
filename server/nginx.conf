# nginx front-end. Serves the /tv web page, proxies control to the Pico, and
# proxies everything else to go2rtc — all behind a LAN allowlist.
#
# Put this in /etc/nginx/sites-available/, symlink into sites-enabled/, drop the
# default site, then `nginx -t && systemctl reload nginx`.
#
# Replace:
#   PICO_IP  = the LAN IP of your Pico 2 W
# and tighten the `allow` lines to the devices/subnets you actually use.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 1984;
    server_name _;

    # --- Access control -------------------------------------------------------
    # Same-subnet traffic never crosses your router's firewall, so restrict here.
    # This page controls your TV; do not expose it to untrusted devices. List the
    # specific client IPs (or subnets) that may use it, plus your VPN subnet.
    allow 127.0.0.1;
    allow 192.168.1.0/24;      # your LAN — tighten to specific device IPs if you prefer
    allow 10.11.11.0/24;       # your VPN subnet (e.g. WireGuard road-warrior), if any
    deny all;

    # --- The integrated watch + control page ---------------------------------
    location = /tv {
        default_type text/html;
        alias /var/www/tv.html;
    }

    # --- Input control -> Pico 2 W USB-HID remote plugged into the box --------
    location /ctl/ {
        proxy_pass http://PICO_IP:5080;
        proxy_read_timeout 15s;
    }

    # --- Everything else -> go2rtc (WebRTC signaling, video-stream.js, api/ws) -
    location / {
        proxy_pass http://127.0.0.1:11984;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
