# go2rtc restreams the HDMI encoder's RTSP feed to WebRTC (smooth video + audio
# in any browser). Put this at /etc/go2rtc/go2rtc.yaml.
#
# Replace the two IPs:
#   SERVER_IP   = the LAN IP of THIS host (running go2rtc)
#   ENCODER_IP  = the LAN IP of your HDMI encoder
api:
  listen: "127.0.0.1:11984"          # localhost only; nginx fronts it (see nginx.conf)

webrtc:
  listen: ":8555"
  candidates:
    - SERVER_IP:8555                 # <-- this host's LAN IP; required or WebRTC won't connect

rtsp:
  listen: ":8554"                    # go2rtc's own RTSP server (used by the keep-warm holder)

streams:
  # Main stream. #timeout=30 rides out cheap encoders whose RTSP handshake is
  # slow/flaky (they're rock-solid once connected). The ffmpeg line adds an Opus
  # audio track because Safari WebRTC won't play the encoder's AAC; MSE still
  # gets the original AAC, so both playback paths have sound.
  tv:
    - "rtsp://ENCODER_IP:554/stream0#timeout=30"
    - "ffmpeg:tv#audio=opus"

  # Optional lower-bitrate second stream (encoder substream) for weak/remote links.
  tv_low:
    - "rtsp://ENCODER_IP:554/sub0#timeout=30"
    - "ffmpeg:tv_low#audio=opus"

  # Data-saver 480p tier for weak cellular. This one is a software transcode of the
  # already-warm 'tv' stream (not a third encoder feed), so it works with any encoder
  # and adds no encoder load. go2rtc runs this ffmpeg ON DEMAND — only while someone
  # is actually watching Saver — so it costs ~nothing when unused (expect a few
  # seconds of cold-start when you switch to it). It re-encodes to 854x480 ~1.2 Mbps
  # and emits BOTH AAC (for MSE) and Opus (for WebRTC). Needs ffmpeg built with libx264.
  tv_mobile:
    # Data-saver 480p tier. Video-only transcode; AUDIO IS COPIED THROUGH untouched
    # (re-encoding it in the same process as the x264 encode starves it -> choppy audio).
    # g=15 => a keyframe every 0.5s so HLS (Buffered mode) starts fast; many hardware
    # encoders emit keyframes only every several seconds regardless of their GOP setting,
    # which makes native-HLS startup slow, so the Buffered tiers are transcoded. Used for
    # Saver in BOTH Live and Buffered. Second line adds Opus for WebRTC.
    - "exec:ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://127.0.0.1:8554/tv -map 0:v -c:v libx264 -preset veryfast -tune zerolatency -vf scale=854:480 -b:v 1200k -maxrate 1300k -bufsize 1600k -g 15 -pix_fmt yuv420p -map 0:a -c:a copy -f rtsp {output}"
    - "ffmpeg:tv_mobile#audio=opus"

  # Short-GOP (0.5s keyframe) transcodes used ONLY by Buffered/HLS mode, so it starts in
  # ~1-2s instead of many seconds. Live/WebRTC keeps the passthrough streams above (it
  # requests a keyframe on connect, so it needs no transcode). On-demand: each runs only
  # while someone is on that Buffered quality.
  tv_hls:                 # Buffered HD (1080p)
    - "exec:ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://127.0.0.1:8554/tv -map 0:v -c:v libx264 -preset veryfast -tune zerolatency -b:v 8000k -maxrate 8500k -bufsize 9000k -g 15 -pix_fmt yuv420p -map 0:a -c:a copy -f rtsp {output}"
    - "ffmpeg:tv_hls#audio=opus"
  tv_low_hls:             # Buffered Lite (720p)
    - "exec:ffmpeg -hide_banner -loglevel error -rtsp_transport tcp -i rtsp://127.0.0.1:8554/tv -map 0:v -c:v libx264 -preset veryfast -tune zerolatency -vf scale=1280:720 -b:v 3500k -maxrate 3800k -bufsize 4200k -g 15 -pix_fmt yuv420p -map 0:a -c:a copy -f rtsp {output}"
    - "ffmpeg:tv_low_hls#audio=opus"
