<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- This <title> becomes the icon label when you "Add to Home Screen". Rename freely. -->
<title>TV</title>
<script type="module" src="/video-stream.js"></script>
<style>
  :root { --gap: 14px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  video-stream { position: absolute; inset: 0; width: 100%; height: 100%; }
  video-stream video { width: 100% !important; height: 100% !important; object-fit: contain; background: #000; }
  /* hide go2rtc's native player chrome + mode label; the remote replaces it */
  video::-webkit-media-controls, video::-webkit-media-controls-enclosure,
  video::-webkit-media-controls-panel { display: none !important; -webkit-appearance: none !important; }
  video-stream > .info, video-stream .mode { display: none !important; }
  /* transparent layer that catches taps (used to (re)enable sound) */
  #touch { position: absolute; inset: 0; z-index: 5; }

  /* unmute hint */
  #unmute { position: absolute; z-index: 8; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: rgba(0,0,0,.65); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px;
    backdrop-filter: blur(6px); display: none; }
  #unmute.show { display: block; }

  /* control dock */
  #dock { position: absolute; z-index: 9; right: env(safe-area-inset-right, 10px); bottom: env(safe-area-inset-bottom, 10px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  #panel { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 8px;
    background: rgba(20,22,28,.55); padding: 12px; border-radius: 20px; backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #panel.hidden { display: none; }
  .row2 { display: flex; gap: 8px; }
  button.b { border: none; color: #fff; background: rgba(255,255,255,.10); border-radius: 14px;
    font-size: 22px; display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
  #panel button.b { width: 56px; height: 56px; }
  button.b:active { background: rgba(90,150,255,.55); transform: scale(.94); }
  .wide { width: 120px !important; height: 48px !important; font-size: 15px; font-weight: 600; letter-spacing: .3px;
    background: rgba(20,22,28,.55); backdrop-filter: blur(10px); }
  .ok { background: rgba(90,150,255,.30) !important; font-size: 15px; font-weight: 700; }
  .pause { background: rgba(120,200,120,.30) !important; font-size: 15px; font-weight: 700; }
  #prof { height: 40px !important; font-size: 13px; }
  #tgl { width: 48px; height: 48px; font-size: 20px; background: rgba(20,22,28,.55); backdrop-filter: blur(10px); border-radius: 14px; }
  .sp { visibility: hidden; }
  #flash { position: absolute; z-index: 7; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid #6ea8ff;
    border-radius: 50%; pointer-events: none; opacity: 0; }
  @keyframes ping { from { opacity: .9; transform: scale(.4);} to { opacity: 0; transform: scale(1.3);} }
  #flash.go { animation: ping .5s ease-out; }
</style>
</head>
<body>
<div id="stage">
  <video-stream id="v"></video-stream>
  <div id="touch"></div>
  <div id="flash"></div>
  <div id="unmute">🔇 Tap anywhere for sound</div>

  <div id="dock">
    <button id="tgl" class="b">✛</button>
    <button id="prof" class="b wide">📶 Home</button>
    <button class="b wide pause" data-k="pause">⏯ Pause</button>
    <div class="row2">
      <button class="b wide" data-k="back">‹ Back</button>
      <button class="b wide" data-k="home">⌂ Home</button>
    </div>
    <div id="panel">
      <div class="b sp"></div>
      <button class="b" data-k="up">▲</button>
      <div class="b sp"></div>
      <button class="b" data-k="left">◀</button>
      <button class="b ok" data-k="ok">OK</button>
      <button class="b" data-k="right">▶</button>
      <div class="b sp"></div>
      <button class="b" data-k="down">▼</button>
      <div class="b sp"></div>
    </div>
  </div>
</div>

<script>
// Connection profiles. Names ('tv', 'tv_low') must match the streams in go2rtc.yaml.
//   Home     = WebRTC (UDP, real-time, sharp) on the full stream. Best on LAN.
//   Cellular = MSE (WebSocket/TCP, buffered) on the lighter substream. TCP resends
//              lost packets and the browser buffers ~1-3s, so video stays smooth on
//              a lossy mobile link instead of dropping to a slideshow (which is what
//              WebRTC does under packet loss — it drops frames to stay real-time).
const PROFILES = {
  home: { mode: 'webrtc,mse', src: 'tv',     label: '📶 Home' },
  cell: { mode: 'mse',        src: 'tv_low', label: '📱 Cellular' },
};
let profile = localStorage.getItem('stream_profile') || 'home';

let v;                    // current <video-stream> element (recreated on switch)
const touch = document.getElementById('touch');
const unmuteHint = document.getElementById('unmute');
const profBtn = document.getElementById('prof');

function connect() {
  const p = PROFILES[profile] || PROFILES.home;
  const el = document.createElement('video-stream');
  el.id = 'v';
  document.getElementById('v').replaceWith(el);
  v = el;
  customElements.whenDefined('video-stream').then(() => {
    el.mode = p.mode;
    el.background = true;                 // keep playing when hidden, don't disconnect
    el.src = new URL('api/ws?src=' + p.src, location.href);
    const iv = setInterval(() => { if (el.video) { el.video.controls = false; clearInterval(iv); } }, 200);
    setTimeout(() => clearInterval(iv), 8000);
  });
  profBtn.textContent = p.label;
}

// Unmute is re-runnable: mobile Safari re-mutes on wake/reconnect, so every tap or
// keypress re-asserts sound; the watcher re-shows the hint whenever it's muted.
function unmute() {
  try { if (v && v.video) { v.video.muted = false; v.video.volume = 1; v.video.play().catch(() => {}); } } catch (e) {}
}
setInterval(() => {
  const muted = !v || !v.video || v.video.muted || v.video.paused;
  unmuteHint.classList.toggle('show', muted);
}, 1500);

async function ctl(path) { try { await fetch('/ctl/' + path, { method: 'POST' }); } catch (e) {} }

// Button -> Pico endpoint.
// Back/Home are consumer-control codes (AC Back / AC Home) because many Android
// boxes ignore a keyboard's Escape as "Back".
const EP = {
  up: 'key?k=up', down: 'key?k=down', left: 'key?k=left', right: 'key?k=right',
  back: 'cons?u=224', home: 'cons?u=223',
  // Single keypad-Enter = one clean pause/play toggle, unlike OK which fires BOTH
  // Enter variants (see sendOk) and would toggle pause twice.
  pause: 'raw?kc=88',
};

// OK/SELECT: some launchers want plain Enter (keycode 40) while some player apps
// want keypad-Enter (keycode 88). Fire both — the one the current screen ignores is
// a harmless no-op. If your box is happy with just one, simplify this.
async function sendOk() { await ctl('raw?kc=88'); setTimeout(() => ctl('raw?kc=40'), 110); }

// Tapping the video only (re)enables sound. Navigation is via the buttons below.
touch.addEventListener('pointerup', () => unmute());

// on-screen control buttons
document.querySelectorAll('button[data-k]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation(); unmute();
    if (btn.dataset.k === 'ok') sendOk();
    else ctl(EP[btn.dataset.k] || ('key?k=' + btn.dataset.k));
  });
});

// Home <-> Cellular toggle (persisted). Reconnects with the new transport + stream.
profBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  profile = (profile === 'home') ? 'cell' : 'home';
  localStorage.setItem('stream_profile', profile);
  connect();
});

// Hardware keyboard: arrows navigate, Return = OK, Delete/Backspace/Esc = Back,
// Space = Pause. Held arrows repeat, throttled so the box's focus keeps up.
let lastArrow = 0;
window.addEventListener('keydown', (e) => {
  const arrows = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  if (e.key in arrows) {
    e.preventDefault();
    const now = Date.now();
    if (e.repeat && now - lastArrow < 180) return;
    lastArrow = now;
    unmute(); ctl(EP[arrows[e.key]]);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (!e.repeat) { unmute(); sendOk(); }
  } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === 'Escape') {
    e.preventDefault();
    if (!e.repeat) { unmute(); ctl(EP.back); }
  } else if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) { unmute(); ctl(EP.pause); }
  }
});

// collapse/expand the D-pad panel
document.getElementById('tgl').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('hidden');
});

connect();
</script>
</body>
</html>
